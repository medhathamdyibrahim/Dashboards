<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Dashboard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.2 CSS only -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">

  <!-- App CSS -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script>
    // Register datalabels plugin globally — must happen before any chart is created
    Chart.register(ChartDataLabels);
    // Default: disable on all charts, enable per-chart explicitly
    Chart.defaults.plugins.datalabels.display = false;
  </script>

  <!-- ExcelJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     SETUP SCREEN
═══════════════════════════════════════════════════════════ -->
<div id="setup-screen">
  <div class="setup-card">
    <div class="setup-logo">
      <div class="setup-logo-icon">FD</div>
      <div class="setup-logo-text">Financial Dashboard</div>
    </div>

    <div class="setup-title">Connect your repository</div>
    <div class="setup-subtitle">Enter your GitHub credentials to load financial data from your private repo.</div>

    <div class="setup-form-group">
      <label class="setup-label" for="input-token">GitHub Personal Access Token</label>
      <input type="password" id="input-token" class="setup-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
    </div>

    <div class="setup-form-group">
      <label class="setup-label" for="input-username">GitHub Username</label>
      <input type="text" id="input-username" class="setup-input" placeholder="your-username" autocomplete="off">
    </div>

    <div class="setup-form-group">
      <label class="setup-label" for="input-repo">Repository Name</label>
      <input type="text" id="input-repo" class="setup-input" placeholder="your-repo-name" autocomplete="off">
    </div>

    <button id="connect-btn" class="setup-btn">Connect &amp; Load Data</button>
    <div id="setup-error" class="setup-error"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     LOADING OVERLAY
═══════════════════════════════════════════════════════════ -->
<div id="loading-overlay" style="display:none;">
  <div class="loading-logo">
    <div class="loading-logo-icon">FD</div>
    <div class="loading-logo-text">Financial Dashboard</div>
  </div>
  <div class="loading-progress-wrap">
    <div class="loading-status" id="loading-status">Initializing…</div>
    <div class="loading-bar-track">
      <div class="loading-bar-fill" id="loading-bar-fill"></div>
    </div>
    <div class="loading-detail" id="loading-detail"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     MAIN APP
═══════════════════════════════════════════════════════════ -->
<div id="app" style="display:none;">

  <!-- TOP HEADER -->
  <header id="main-header">
    <div class="header-left">
      <div class="header-logo">
        <div class="header-logo-icon">FD</div>
        <div class="header-logo-text">Financial Dashboard</div>
      </div>
      <div class="header-divider"></div>
      <!-- Filter Bar -->
      <div id="filter-bar">
        <div class="filter-group">
          <span class="filter-label">Year</span>
          <select id="filter-year" class="filter-select"></select>
        </div>
        <div class="filter-group">
          <span class="filter-label">Month</span>
          <select id="filter-month" class="filter-select"></select>
        </div>
        <div class="filter-group">
          <span class="filter-label">Entity</span>
          <select id="filter-entity" class="filter-select"></select>
        </div>
        <span id="period-badge"></span>
      </div>
    </div>

    <div class="header-right">
      <button id="usd-toggle-btn" class="header-btn" onclick="toggleUSDMode()" title="Toggle USD/EGP view" style="font-weight:700;letter-spacing:.02em">
        EGP
      </button>
      <button id="export-btn" class="header-btn" onclick="exportToExcel()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Excel
      </button>
      <button id="theme-toggle" class="header-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
      <button class="header-btn" onclick="signOut()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </div>
  </header>

  <!-- TAB BAR -->
  <nav id="tab-bar">
    <button class="tab-btn active" data-tab="statements" onclick="switchTab('statements')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      Statements
    </button>
    <button class="tab-btn" data-tab="charts" onclick="switchTab('charts')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Charts
    </button>
    <button class="tab-btn" data-tab="opex" onclick="switchTab('opex')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      OpEx Detail
    </button>
    <button class="tab-btn" data-tab="sales" onclick="switchTab('sales')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Revenue
    </button>
    <button class="tab-btn" data-tab="ratios" onclick="switchTab('ratios')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Ratios
    </button>
    <button class="tab-btn" data-tab="aging" onclick="switchTab('aging')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Aging
    </button>
  </nav>

  <!-- MAIN CONTENT -->
  <main id="main-content">

    <!-- ── STATEMENTS TAB ──────────────────────────────────── -->
    <div id="tab-statements" class="tab-panel active">
      <div id="statements-container"></div>
    </div>

    <!-- ── CHARTS TAB ──────────────────────────────────────── -->
    <div id="tab-charts" class="tab-panel">
      <div id="charts-grid"></div>
    </div>

    <!-- ── OPEX DETAIL TAB ─────────────────────────────────── -->
    <div id="tab-opex" class="tab-panel">
      <div id="opex-controls">

        <!-- Row 1: Search + Category chips + Entity + Parent filters -->
        <div class="opex-controls-row1">
          <div class="search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="table-search" placeholder="Search transactions…">
          </div>
          <div id="category-chips" class="filter-chips"></div>
          <div id="opex-extra-filters" class="opex-extra-filters"></div>
        </div>

        <!-- Row 2: Pivot field chooser (collapsible separator) -->
        <div id="pivot-field-chooser" class="opex-controls-row2"></div>

      </div>
      <div id="opex-table-container"></div>
      <div id="opex-pivot-container"></div>
    </div>

    <!-- ── REVENUE TAB ──────────────────────────────────────── -->
    <div id="tab-sales" class="tab-panel">
      <div id="sales-container">
        <div class="empty-state"><div class="empty-state-title">No revenue data loaded yet.</div></div>
      </div>
    </div>

    <!-- ── RATIOS TAB ──────────────────────────────────────── -->
    <div id="tab-ratios" class="tab-panel">
      <div id="ratios-container">
        <div class="empty-state"><div class="empty-state-title">Select a period to view ratios</div></div>
      </div>
    </div>

    <!-- ── AGING TAB ───────────────────────────────────────── -->
    <div id="tab-aging" class="tab-panel">
      <div id="aging-container"></div>
    </div>

  </main>
</div>

<!-- Chart settings panel -->
<div id="chart-settings-panel">
  <div class="settings-panel-title">Chart Settings</div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- ═══════════════════════════════════════════════════════════
     SCRIPTS — all from js/ folder, load order matters
═══════════════════════════════════════════════════════════ -->
<script src="js/config.js"></script>
<script src="js/obfuscation.js"></script>
<script src="js/github.js"></script>
<script src="js/mapping.js"></script>
<script src="js/loader-tb.js"></script>
<script src="js/loader-opex.js"></script>
<script src="js/loader-sales.js"></script>
<script src="js/loader-fx.js"></script>
<script src="js/loader-budget.js"></script>
<script src="js/periods.js"></script>
<script src="js/pl-structures.js"></script>
<script src="js/bs-structure.js"></script>
<!-- Statements split -->
<script src="js/statements-shared.js"></script>
<script src="js/statements-mc.js"></script>
<script src="js/statements-dp.js"></script>
<script src="js/statements.js"></script>
<!-- End statements split -->
<script src="js/renderer-pl.js"></script>
<script src="js/renderer-bs.js"></script>
<script src="js/filters.js"></script>
<script src="js/kpis.js"></script>
<script src="js/charts.js"></script>
<script src="js/table.js"></script>
<script src="js/pivot.js"></script>
<!-- Sales dashboard split -->
<script src="js/sales-shared.js"></script>
<script src="js/sales-dashboard-mc.js"></script>
<script src="js/sales-dashboard-dp.js"></script>
<script src="js/sales-dashboard.js"></script>
<!-- End sales dashboard split -->
<script src="js/ratios.js"></script>
<script src="js/loader-aging.js"></script>
<script src="js/aging-dashboard.js"></script>
<script src="js/export.js"></script>
<script src="js/chart-preferences.js"></script>
<script src="js/chart-settings.js"></script>

<script>
'use strict';
/* ============================================================
   MAIN APPLICATION BOOTSTRAP
   ============================================================ */

function applyTheme(theme) {
  STATE.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  saveTheme(theme);
}

function toggleTheme() {
  applyTheme(STATE.theme === 'dark' ? 'light' : 'dark');
  if (STATE.activeTab === 'charts') updateCharts();
}

function signOut() {
  clearCreds();
  location.reload();
}

function switchTab(tabId) {
  STATE.activeTab = tabId;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tabId);
  });
  document.querySelectorAll('.tab-panel').forEach(panel => {
    panel.classList.remove('active');
  });
  const target = document.getElementById(`tab-${tabId}`);
  if (target) target.classList.add('active');
  if (tabId === 'charts') updateCharts();
  else if (tabId === 'opex') { initTableTab(); renderOpExTable(); renderOpExPivot(); }
  else if (tabId === 'ratios') { if (typeof renderRatios === 'function') renderRatios(); }
  else if (tabId === 'sales') { if (typeof renderSalesDashboard === 'function') renderSalesDashboard(); }
  else if (tabId === 'aging') { if (typeof renderAgingDashboard === 'function') renderAgingDashboard(); }
}

// ── USD / EGP toggle ──────────────────────────────────────────
function toggleUSDMode() {
  STATE.usdMode = !STATE.usdMode;

  // ── Update toggle button ──────────────────────────────────
  const btn = document.getElementById('usd-toggle-btn');
  if (btn) {
    btn.textContent = STATE.usdMode ? 'USD' : 'EGP';
    btn.style.color = STATE.usdMode ? '#2563eb' : '';
    btn.style.borderColor = STATE.usdMode ? '#2563eb' : '';
  }

  const { year, month, company } = STATE.filters;
  const entities = company ? [company] : ENTITY_FOLDERS;
  const columns  = buildColumnHeaders(year, month);

  // ── Re-render only table contents & KPIs in-place ─────────
  // No DOM rebuild → no flicker. Entity block structure stays intact.
  for (const entityFolder of entities) {
    const stmt     = STATE.statements[entityFolder];
    if (!stmt) continue;
    const isMasria = entityFolder === 'Masria Cards';
    const id       = entityFolder.replace(/\s/g, '_');

    // P&L table
    const plBody = document.getElementById(`pl-body-${id}`);
    if (plBody) plBody.innerHTML = renderPLTable(stmt.IS, columns, isMasria);

    // BS table
    const bsBody = document.getElementById(`bs-body-${id}`);
    if (bsBody) bsBody.innerHTML = renderBSTable(stmt.BS, year, month);

    // KPI cards
    const kpiSlot = document.getElementById(`kpi-${id}`);
    if (kpiSlot && typeof _buildMCKPIs === 'function') {
      const cards = isMasria
        ? _buildMCKPIs(entityFolder, { year, month })
        : _buildDPKPIs(entityFolder, { year, month });
      kpiSlot.innerHTML = _renderEntityKPICards(cards);
    }
  }

  // ── Sales tab: re-render if active ───────────────────────
  if (STATE.activeTab === 'sales' && typeof renderSalesDashboard === 'function') {
    renderSalesDashboard();
  }
}

// ── Entity section collapse in Statements ─────────────────────
function toggleEntityBlock(entityFolder) {
  const id   = entityFolder.replace(/\s/g,'_');
  const body = document.getElementById(`entity-body-${id}`);
  const icon = document.getElementById(`entity-icon-${id}`);
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (icon) icon.textContent = hidden ? '−' : '+';
}

function renderAllEntities() {
  const container = document.getElementById('statements-container');
  if (!container) return;

  const { year, month, company } = STATE.filters;
  if (!year || !month) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-title">Select a period to view statements</div></div>';
    return;
  }

  container.innerHTML = '';
  if (typeof initPLToggleListeners === 'function') initPLToggleListeners();
  const columns  = buildColumnHeaders(year, month);
  const entities = company ? [company] : ENTITY_FOLDERS;

  for (const entityFolder of entities) {
    const stmt = STATE.statements[entityFolder];
    if (!stmt) continue;

    const ent      = MASTER.entity[entityFolder] || {};
    const rawName  = ent.companyName || entityFolder;
    const name     = rawName === 'Masria Cards' ? 'modupay Cards'
                   : rawName === 'mdp'           ? 'modupay DP'
                   : rawName;
    const segment  = ent.segmentName || ent.segment || '';
    const currency = ent.currency    || '';
    const isMasria = entityFolder === 'Masria Cards';

    const id = entityFolder.replace(/\s/g,'_');
    const block = document.createElement('div');
    block.className = 'entity-block';
    block.innerHTML = `
      <div class="entity-block-header" style="cursor:pointer" onclick="toggleEntityBlock('${entityFolder}')">
        <div class="entity-block-title">${escHtml(name)}</div>
        ${segment  ? `<span class="entity-badge entity-badge-segment">${escHtml(segment)}</span>` : ''}
        ${currency ? `<span class="entity-badge entity-badge-currency">${escHtml(currency)}</span>` : ''}
        <span id="entity-icon-${id}" style="margin-left:auto;font-size:18px;color:var(--primary)">−</span>
      </div>
      <div id="entity-body-${id}">
        <div id="kpi-${id}" class="entity-inline-kpis"></div>
        <div class="statement-section-label" style="cursor:pointer" onclick="toggleEntityPL('${entityFolder}')">
          Income Statement
          <span id="pl-icon-${id}" style="margin-left:8px;font-size:14px;color:var(--primary)">−</span>
        </div>
        <div id="pl-body-${id}">
          ${renderPLTable(stmt.IS, columns, isMasria)}
        </div>
        <div class="statement-section-label" style="cursor:pointer" onclick="toggleEntityBS('${entityFolder}')">
          Balance Sheet
          <span id="bs-icon-${id}" style="margin-left:8px;font-size:14px;color:var(--primary)">−</span>
        </div>
        <div id="bs-body-${id}">
          ${renderBSTable(stmt.BS, year, month)}
        </div>
      </div>
    `;
    container.appendChild(block);
    // Render KPIs inline into this entity's KPI slot
    const kpiSlot = block.querySelector(`#kpi-${id}`);
    if (kpiSlot && typeof _buildMCKPIs === 'function') {
      const cards = isMasria
        ? _buildMCKPIs(entityFolder, { year, month })
        : _buildDPKPIs(entityFolder, { year, month });
      kpiSlot.innerHTML = _renderEntityKPICards(cards);
    }
  }

  if (container.children.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-title">No data for selected period</div><div class="empty-state-body">Try selecting a different year or month combination.</div></div>';
  }
}

function toggleEntityPL(entityFolder) {
  const id   = entityFolder.replace(/\s/g,'_');
  const body = document.getElementById(`pl-body-${id}`);
  const icon = document.getElementById(`pl-icon-${id}`);
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (icon) icon.textContent = hidden ? '−' : '+';
}
function toggleEntityBS(entityFolder) {
  const id   = entityFolder.replace(/\s/g,'_');
  const body = document.getElementById(`bs-body-${id}`);
  const icon = document.getElementById(`bs-icon-${id}`);
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (icon) icon.textContent = hidden ? '−' : '+';
}

async function loadAllData(creds) {
  const { token, username, repo } = creds;
  try {
    setLoadingProgress(2, 'Connecting to GitHub…');
    const valid = await validateCreds(token, username, repo);
    if (!valid) throw new Error('Cannot access repository. Check your token and repo name.');

    await loadMasterMapping(token, username, repo);
    setLoadingProgress(12, 'Loading adj entries…');

    for (const ef of ENTITY_FOLDERS) {
      await loadAdjEntries(token, username, repo, ef);
    }
    setLoadingProgress(15, 'Loading Trial Balance files…');

    STATE.tbRows   = await loadAllTB(token, username, repo);
    setLoadingProgress(72, 'Loading OpEx files…');

    STATE.opexRows = await loadAllOpEx(token, username, repo);
    setLoadingProgress(82, 'Loading Sales data…');

    if (typeof loadAllSales === 'function') {
      STATE.salesRows = await loadAllSales(token, username, repo);
    }
    setLoadingProgress(85, 'Loading FX rates…');
    if (typeof loadFXData === 'function') {
      await loadFXData(token, username, repo);
    }
    setLoadingProgress(88, 'Loading budget data…');
    if (typeof loadAllBudget === 'function') {
      await loadAllBudget(token, username, repo);
    }
    setLoadingProgress(91, 'Loading Aging data…');
    if (typeof loadAllAging === 'function') {
      STATE.agingRows = await loadAllAging(token, username, repo);
    }
    setLoadingProgress(94, 'Building statements…');

    populateFilters();
    initFilters();
    buildAllStatements();

    setLoadingProgress(97, 'Rendering…');
    renderAllEntities();
    renderKPIs();
    loadChartPrefs();
    applyChartPrefs();
    initChartSettings();
    if (typeof renderSalesDashboard === 'function') renderSalesDashboard();

    setLoadingProgress(100, 'Done!');
    await new Promise(r => setTimeout(r, 400));

    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    showToast(`Loaded ${STATE.tbRows.length.toLocaleString()} TB + ${STATE.opexRows.length.toLocaleString()} OpEx + ${(STATE.salesRows||[]).length.toLocaleString()} Sales + ${(STATE.agingRows||[]).length.toLocaleString()} Aging rows`, 'success', 4000);

  } catch (err) {
    console.error('Data load failed:', err);
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'flex';
    const errEl = document.getElementById('setup-error');
    if (errEl) { errEl.textContent = err.message || 'Load failed.'; errEl.style.display = 'block'; }
  }
}

async function handleConnect() {
  const token    = document.getElementById('input-token')?.value.trim();
  const username = document.getElementById('input-username')?.value.trim();
  const repo     = document.getElementById('input-repo')?.value.trim();
  const errEl    = document.getElementById('setup-error');

  if (!token || !username || !repo) {
    if (errEl) { errEl.textContent = 'Please fill in all fields.'; errEl.style.display = 'block'; }
    return;
  }
  if (errEl) errEl.style.display = 'none';

  saveCreds(token, username, repo);
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('loading-overlay').style.display = 'flex';
  await loadAllData({ token, username, repo });
}

(async function init() {
  applyTheme(loadTheme());

  document.getElementById('connect-btn')?.addEventListener('click', handleConnect);
  document.querySelectorAll('.setup-input').forEach(input => {
    input.addEventListener('keydown', e => { if (e.key === 'Enter') handleConnect(); });
  });

  const creds = loadCreds();
  if (creds?.token && creds?.username && creds?.repo) {
    const tok = document.getElementById('input-token');
    const usr = document.getElementById('input-username');
    const rep = document.getElementById('input-repo');
    if (tok) tok.value = creds.token;
    if (usr) usr.value = creds.username;
    if (rep) rep.value = creds.repo;

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('loading-overlay').style.display = 'flex';
    await loadAllData(creds);
  }
})();
</script>
</body>
</html>
